 are not copied into localStorage\n  const imgByKey = SEED.images || {};\n  const keyByImg = Object.fromEntries(Object.entries(imgByKey).map(([k, v]) => [v, k]));\n  const resolveImg = (s) => (s && s.startsWith(\"seedimg:\") ? imgByKey[s.slice(8)] || \"\" : s);\n  const packImg = (s) => (s && keyByImg[s] ? \"seedimg:\" + keyByImg[s] : s);\n\n  // ---------------------------------------------------------------- storage\n  let canStore = true, mem = null, memAdmin = false;\n  try { localStorage.setItem(\"__kvs\", \"1\"); localStorage.removeItem(\"__kvs\"); } catch { canStore = false; }\n  const fresh = () => ({ version: Date.now(), items: JSON.parse(JSON.stringify(SEED.items)), settings: { ...SEED.settings }, auth: { username: DEMO_USER, password: DEMO_PASS } });\n  function load() {\n    if (canStore) {\n      try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.items)) return d; } catch { /* corrupt -> reseed */ }\n    }\n    return mem || (mem = fresh());\n  }\n  function save(d) {\n    d.version = Date.now();\n    if (canStore) {\n      try { localStorage.setItem(KEY, JSON.stringify(d)); }\n      catch { throw new Error(\"Browser storage is full — remove some photos or use smaller images.\"); }\n    }\n    mem = d;\n    return d;\n  }\n  const isAdmin = () => { try { return sessionStorage.getItem(\"kvs_demo_admin\") === \"1\"; } catch { return memAdmin; } };\n  const setAdmin = (v) => { memAdmin = v; try { v ? sessionStorage.setItem(\"kvs_demo_admin\", \"1\") : sessionStorage.removeItem(\"kvs_demo_admin\"); } catch { /* ignore */ } };\n\n  // ---------------------------------------------------------------- normalising (mirrors app.py)\n  const rid = () => Math.random().toString(16).slice(2, 14).padEnd(12, \"0\");\n  const yes = (v) => typeof v === \"boolean\" ? v : [\"yes\", \"y\", \"true\", \"1\", \"✓\", \"x\", \"ஆம்\"].includes(String(v ?? \"\").trim().toLowerCase());\n  const num = (v, int) => {\n    if (v == null || String(v).trim() === \"\") return null;\n    const n = parseFloat(String(v).replace(/[,₹\\s]/g, \"\"));\n    return isNaN(n) ? null : int ? Math.trunc(n) : n;\n  };\n  function parseAv(v, stock) {\n    const s = String(v ?? \"\").trim().toLowerCase().replace(/[-_]/g, \" \");\n    if (s) {\n      if ([\"in stock\", \"available\", \"yes\", \"instock\", \"in\"].includes(s)) return \"in_stock\";\n      if (s.startsWith(\"low\") || [\"limited\", \"few left\"].includes(s)) return \"low_stock\";\n      if (s.startsWith(\"out\") || [\"no\", \"unavailable\", \"sold out\", \"nil\"].includes(s)) return \"out_of_stock\";\n      if (s.includes(\"order\") || [\"pre order\", \"coming soon\", \"awaited\"].includes(s)) return \"on_order\";\n    }\n    if (stock == null) return \"in_stock\";\n    if (stock <= 0) return \"out_of_stock\";\n    return stock <= LOW ? \"low_stock\" : \"in_stock\";\n  }\n  const str = (v) => String(v ?? \"\").trim();\n  function normalise(it) {\n    const stock = num(it.stock, true);\n    const out = {\n      id: it.id || rid(), sku: str(it.sku), name_en: str(it.name_en), name_ta: str(it.name_ta),\n      category: str(it.category) || \"Other\", brand: str(it.brand), desc_en: str(it.desc_en), desc_ta: str(it.desc_ta),\n      unit: str(it.unit), price: num(it.price), stock, image: packImg(str(it.image)),\n      highlight: yes(it.highlight), innovation: yes(it.innovation), specs: str(it.specs), updated: Math.floor(Date.now() / 1000),\n    };\n    out.availability = AV.includes(it.availability) ? it.availability : parseAv(it.availability, stock);\n    if (!out.sku) out.sku = \"KVS-\" + out.id.slice(0, 6).toUpperCase();\n    return out;\n  }\n\n  // ---------------------------------------------------------------- Excel (SheetJS, loaded on first use)\n  const COLUMNS = [\n    [\"sku\", \"SKU\", 16, [\"code\", \"item code\", \"part no\", \"id\"]],\n    [\"name_en\", \"Name (English)\", 34, [\"name\", \"item\", \"item name\", \"product\", \"product name\"]],\n    [\"name_ta\", \"Name (Tamil)\", 34, [\"tamil name\", \"பெயர்\"]],\n    [\"category\", \"Category\", 20, [\"group\", \"type\"]],\n    [\"brand\", \"Brand\", 18, [\"make\", \"manufacturer\"]],\n    [\"unit\", \"Unit\", 16, [\"uom\", \"pack\", \"per\"]],\n    [\"price\", \"Price (INR)\", 13, [\"price\", \"rate\", \"mrp\", \"price inr\"]],\n    [\"stock\", \"Stock Qty\", 11, [\"stock\", \"qty\", \"quantity\", \"stock quantity\"]],\n    [\"availability\", \"Availability\", 16, [\"status\", \"available\"]],\n    [\"highlight\", \"Highlight (Yes/No)\", 16, [\"highlight\", \"featured\"]],\n    [\"innovation\", \"New Innovation (Yes/No)\", 20, [\"innovation\", \"new innovation\", \"new\"]],\n    [\"image\", \"Image (URL or file name)\", 30, [\"image\", \"image url\", \"photo\", \"picture\"]],\n    [\"desc_en\", \"Description (English)\", 50, [\"description\", \"details\"]],\n    [\"desc_ta\", \"Description (Tamil)\", 50, [\"tamil description\", \"விவரம்\"]],\n    [\"specs\", \"Specs (Key: Value; ...)\", 50, [\"specs\", \"specifications\"]],\n  ];\n  const headerKey = (h) => {\n    h = String(h ?? \"\").trim().toLowerCase().replace(/\\s+/g, \" \");\n    const c = COLUMNS.find(([k, head, , al]) => h === head.toLowerCase() || h === k || al.includes(h));\n    return c ? c[0] : null;\n  };\n  let xlsxP = null;\n  function loadXLSX() {\n    if (window.XLSX) return Promise.resolve(window.XLSX);\n    return (xlsxP ??= new Promise((ok, bad) => {\n      const s = document.createElement(\"script\");\n      s.src = XLSX_URL;\n      s.onload = () => ok(window.XLSX);\n      s.onerror = () => { xlsxP = null; bad(new Error(\"Excel features need an internet connection (the Excel library could not be loaded).\")); };\n      document.head.appendChild(s);\n    }));\n  }\n  async function downloadWorkbook(items, filename) {\n    const X = await loadXLSX();\n    const rows = [COLUMNS.map((c) => c[1])];\n    items.forEach((it) => rows.push(COLUMNS.map(([k]) => {\n      const v = it[k];\n      if (k === \"availability\") return AV_LABEL[v] || v;\n      if (k === \"highlight\" || k === \"innovation\") return v ? \"Yes\" : \"No\";\n      if (k === \"image\") return /^https?:\\/\\//i.test(v || \"\") ? v : \"\"; // embedded photos stay in the app; blank keeps them on import\n      return v ?? \"\";\n    })));\n    const ws = X.utils.aoa_to_sheet(rows);\n    ws[\"!cols\"] = COLUMNS.map((c) => ({ wch: c[2] }));\n    const help = X.utils.aoa_to_sheet([\n      [\"KVS&CO item workbook\"], [],\n      [\"SKU\", \"Unique code per item. Import matches existing items by SKU (merge mode).\"],\n      [\"Name (English/Tamil)\", \"Tamil is optional — English is shown if Tamil is blank.\"],\n      [\"Price (INR)\", \"Optional indicative price. Leave blank for 'Price on request'.\"],\n      [\"Stock Qty\", \"Optional. If Availability is blank it is derived: 0 = Out of Stock, 1-10 = Low Stock, more = In Stock.\"],\n      [\"Availability\", \"In Stock / Low Stock / Out of Stock / On Order.\"],\n      [\"Highlight / New Innovation\", \"Yes puts the item in the Highlights rail / New Innovations section.\"],\n      [\"Image\", \"Optional web URL. Easier: leave blank and add photos in Admin > Items (right-click an item). Blank keeps the existing photo.\"],\n      [\"Specs\", \"Key: Value pairs separated by semicolons, e.g. Grade: 53; Standard: IS 12269\"],\n      [], [\"Import modes\", \"Merge = add new SKUs and update existing ones. Replace = the workbook becomes the full catalogue.\"],\n    ]);\n    help[\"!cols\"] = [{ wch: 28 }, { wch: 100 }];\n    const wb = X.utils.book_new();\n    X.utils.book_append_sheet(wb, ws, \"Items\");\n    X.utils.book_append_sheet(wb, help, \"How to use\");\n    X.writeFile(wb, filename);\n  }\n  async function parseWorkbook(file) {\n    const X = await loadXLSX();\n    let wb;\n    try { wb = X.read(await file.arrayBuffer(), { type: \"array\" }); } catch (e) { throw new Error(\"Could not read workbook: \" + e.message); }\n    const ws = wb.Sheets.Items || wb.Sheets[wb.SheetNames[0]];\n    const grid = X.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true, blankrows: true });\n    if (!grid.length) throw new Error(\"The sheet is empty.\");\n    const keys = grid[0].map(headerKey);\n    if (!keys.includes(\"name_en\") && !keys.includes(\"sku\")) throw new Error(\"No 'Name (English)' or 'SKU' column found. Download the template to see the expected headers.\");\n    const rows = [], errors = [];\n    grid.slice(1).forEach((row, n) => {\n      if (!row || row.every((v) => v == null || String(v).trim() === \"\")) return;\n      const raw = {};\n      keys.forEach((k, i) => { if (k) raw[k] = row[i]; });\n      if (!str(raw.name_en)) { errors.push({ row: n + 2, error: \"Missing Name (English)\" }); return; }\n      rows.push(raw);\n    });\n    return { rows, errors };\n  }\n  function runImport(d, rows, errors, mode, dry) {\n    const existing = new Map(d.items.map((i) => [i.sku.toLowerCase(), i]));\n    const result = [], added = [], updated = [], seen = new Set();\n    for (const raw of rows) {\n      const key = str(raw.sku).toLowerCase();\n      if (key && seen.has(key)) { errors.push({ row: null, error: `Duplicate SKU ${str(raw.sku)} — later row ignored` }); continue; }\n      let item;\n      if (key && existing.has(key)) {\n        const old = existing.get(key);\n        const patch = Object.fromEntries(Object.entries(raw).filter(([, v]) => v != null && String(v).trim() !== \"\"));\n        if (!(\"availability\" in patch) && \"stock\" in patch) patch.availability = null;\n        item = normalise({ ...old, ...patch, id: old.id });\n        updated.push(item.sku);\n      } else {\n        item = normalise(raw);\n        added.push(item.sku);\n      }\n      seen.add(item.sku.toLowerCase());\n      result.push(item);\n    }\n    let final, removed = [];\n    if (mode === \"replace\") {\n      final = result;\n      removed = d.items.filter((i) => !seen.has(i.sku.toLowerCase())).map((i) => i.sku);\n    } else {\n      final = d.items.filter((i) => !seen.has(i.sku.toLowerCase())).concat(result);\n    }\n    const unresolvedImages = result.filter((i) => i.image && !/^(https?:\\/\\/|data:|seedimg:)/i.test(i.image)).map((i) => i.sku);\n    const summary = { mode, rows: rows.length, added, updated, removed, errors, unresolvedImages, total: final.length, committed: false };\n    if (!dry) { d.items = final; summary.version = save(d).version; summary.committed = true; }\n    return summary;\n  }\n\n  // ---------------------------------------------------------------- photos -> resized data URLs\n  async function toDataURL(file) {\n    const ext = (file.name.match(/\\.[^.]+$/) || [\"\"])[0].toLowerCase();\n    if (![\".png\", \".jpg\", \".jpeg\", \".webp\", \".gif\"].includes(ext)) throw new Error(`${file.name}: only PNG, JPG, WEBP or GIF images are allowed.`);\n    const url = URL.createObjectURL(file);\n    try {\n      const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error(`${file.name}: file content is not a valid image.`)); i.src = url; });\n      const s = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));\n      const c = document.createElement(\"canvas\");\n      c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));\n      c.getContext(\"2d\").drawImage(img, 0, 0, c.width, c.height);\n      return ext === \".png\" ? c.toDataURL(\"image/webp\", 0.85) : c.toDataURL(\"image/jpeg\", 0.82);\n    } finally { URL.revokeObjectURL(url); }\n  }\n\n  // ---------------------------------------------------------------- router\n  const res = (status, obj) => new Response(JSON.stringify(obj), { status, headers: { \"Content-Type\": \"application/json\" } });\n  const view = (d) => ({ version: d.version, items: d.items.map((i) => ({ ...i, image: resolveImg(i.image) })) });\n  const SETTING_KEYS = [\"company_name\", \"tagline_en\", \"tagline_ta\", \"phone\", \"whatsapp\", \"email\", \"address_en\", \"address_ta\", \"hours_en\", \"hours_ta\", \"show_prices\", \"map_url\"];\n\n  async function route(path, method, body) {\n    const json = () => (typeof body === \"string\" ? JSON.parse(body || \"{}\") : {});\n    const d = load();\n    if (path === \"/api/catalog\") return res(200, { ...view(d), settings: d.settings });\n    if (path === \"/api/version\") return res(200, { version: d.version });\n    if (path === \"/api/me\") return res(200, { admin: isAdmin(), defaultPassword: false });\n    if (path === \"/api/login\") {\n      const b = json();\n      if (b.username === d.auth.username && b.password === d.auth.password) { setAdmin(true); return res(200, { ok: true, defaultPassword: false }); }\n      return res(401, { error: \"Wrong username or password.\" });\n    }\n    if (path === \"/api/logout\") { setAdmin(false); return res(200, { ok: true }); }\n    if (!isAdmin()) return res(401, { error: \"Not signed in\" });\n\n    if (path === \"/api/admin/password\") {\n      const b = json();\n      if (b.current !== d.auth.password) return res(400, { error: \"Current password is wrong.\" });\n      if (String(b.new || \"\").length < 8) return res(400, { error: \"New password must be at least 8 characters.\" });\n      d.auth = { username: str(b.username) || d.auth.username, password: b.new };\n      save(d); return res(200, { ok: true });\n    }\n    if (path === \"/api/admin/settings\" && method === \"PUT\") {\n      const b = json();\n      for (const [k, v] of Object.entries(b)) if (SETTING_KEYS.includes(k)) d.settings[k] = k === \"show_prices\" ? !!v : str(v);\n      save(d); return res(200, { settings: d.settings });\n    }\n    if (path === \"/api/admin/items\" && method === \"POST\") {\n      const item = normalise(json()); item.id = rid();\n      if (d.items.some((i) => i.sku.toLowerCase() === item.sku.toLowerCase())) return res(400, { error: `SKU ${item.sku} already exists.` });\n      d.items.push(item); save(d);\n      return res(200, { ...view(d), item: { ...item, image: resolveImg(item.image) } });\n    }\n    const m = path.match(/^\\/api\\/admin\\/items\\/([^/]+)(\\/image)?$/);\n    if (m) {\n      const idx = d.items.findIndex((i) => i.id === m[1]);\n      if (idx < 0) return res(404, { error: \"Item not found\" });\n      let it = d.items[idx];\n      if (m[2] && method === \"POST\") {\n        const f = body.get(\"file\"); if (!f) return res(400, { error: \"No file received\" });\n        it.image = await toDataURL(f); it.updated = Math.floor(Date.now() / 1000);\n      } else if (m[2] && method === \"DELETE\") {\n        it.image = \"\";\n      } else if (method === \"PUT\") {\n        it = normalise({ ...it, image: resolveImg(it.image), ...json(), id: it.id });\n        if (d.items.some((o) => o.id !== it.id && o.sku.toLowerCase() === it.sku.toLowerCase())) return res(400, { error: `SKU ${it.sku} already exists.` });\n        d.items[idx] = it;\n      } else if (method === \"DELETE\") {\n        d.items.splice(idx, 1); save(d); return res(200, view(d));\n      }\n      save(d);\n      return res(200, { ...view(d), item: { ...it, image: resolveImg(it.image) } });\n    }\n    if (path === \"/api/admin/upload\") {\n      const saved = [], errors = [];\n      for (const f of body.getAll(\"files\")) {\n        try { saved.push({ file: f.name, url: await toDataURL(f) }); } catch (e) { errors.push(e.message); }\n      }\n      return res(200, { saved, errors, linked: [], version: d.version });\n    }\n    if (path === \"/api/admin/import\") {\n      const f = body.get(\"file\");\n      if (!f || !/\\.xls[xm]$/i.test(f.name)) return res(400, { error: \"Please choose an .xlsx workbook.\" });\n      const { rows, errors } = await parseWorkbook(f);\n      return res(200, runImport(d, rows, errors, body.get(\"mode\") || \"merge\", body.get(\"dry\") !== \"0\"));\n    }\n    return res(404, { error: \"Not found\" });\n  }\n\n  const realFetch = window.fetch.bind(window);\n  window.fetch = async (input, opts = {}) => {\n    const url = typeof input === \"string\" ? input : input.url;\n    if (!url.startsWith(\"/api/\")) return realFetch(input, opts);\n    try { return await route(url.split(\"?\")[0], (opts.method || \"GET\").toUpperCase(), opts.body); }\n    catch (e) { return res(400, { error: e.message || String(e) }); }\n  };\n\n  // template / export links -> generate the workbook in the browser\n  document.addEventListener(\"click\", async (e) => {\n    const a = e.target.closest('a[href^=\"/api/admin/\"]');\n    if (!a) return;\n    e.preventDefault();\n    try {\n      if (a.getAttribute(\"href\").endsWith(\"/template\")) await downloadWorkbook(SEED.items.slice(0, 3), \"KVSCO_items_template.xlsx\");\n      else await downloadWorkbook(load().items, `KVSCO_items_${new Date().toISOString().slice(0, 10)}.xlsx`);\n    } catch (err) { alert(err.message); }\n  }, true);\n\n  // demo banner (admin page only)\n  document.addEventListener(\"DOMContentLoaded\", () => {\n    const login = document.getElementById(\"loginForm\");\n    if (!login) return;\n    const hint = document.createElement(\"p\");\n    hint.className = \"demo-hint\";\n    hint.innerHTML = `Demo login: <b>${DEMO_USER}<\/b> / <b>${DEMO_PASS}<\/b>`;\n    login.querySelector(\".form-error\").before(hint);\n    const bar = document.createElement(\"div\");\n    bar.className = \"demo-bar glass\";\n    bar.innerHTML = `<span><b>Demo copy.<\/b> Changes are saved only in this browser${canStore ? \"\" : \" (and lost when the page closes)\"}.<\/span>\n      <button type=\"button\" class=\"btn btn-sm\">Reset demo data<\/button>`;\n    bar.querySelector(\"button\").addEventListener(\"click\", () => {\n      if (!confirm(\"Reset all items, photos and settings back to the original demo data?\")) return;\n      try { localStorage.removeItem(KEY); } catch { /* ignore */ }\n      mem = null; location.reload();\n    });\n    document.querySelector(\".admin-main\")?.prepend(bar);\n  });\n})() ighlight).slice(0, 3);\n    $(\"#heroMini\").innerHTML = picks.map((i) => `\n      <div class=\"row\"><span class=\"ic\">${icon(i.category)}<\/span><span class=\"nm\">${esc(nm(i))}<\/span>${badge(i.availability)}<\/div>`).join(\"\");\n    $(\"#heroCall\").href = telLink();\n  }\n\n  function countUp(el, to) {\n    const from = Number(el.dataset.v || 0);\n    el.dataset.v = to;\n    if (matchMedia(\"(prefers-reduced-motion: reduce)\").matches || from === to) { el.textContent = to; return; }\n    const start = performance.now();\n    const step = (now) => {\n      const p = Math.min(1, (now - start) / 900);\n      el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));\n      if (p < 1) requestAnimationFrame(step);\n    };\n    requestAnimationFrame(step);\n  }\n\n  function renderHighlights() {\n    const list = state.items.filter((i) => i.highlight);\n    $(\"#highlights\").hidden = !list.length;\n    $(\"#rail\").innerHTML = list.map((i) => `\n      <button type=\"button\" class=\"hl-card glass\" data-id=\"${esc(i.id)}\">\n        <div class=\"hl-media\">\n          <span class=\"hl-ribbon\">${icon(\"star\")}${esc(t(\"highlight_tag\"))}<\/span>\n          ${productArt(i)}\n          ${badge(i.availability)}\n        <\/div>\n        <div class=\"hl-body\">\n          <span class=\"tag tag-primary\" style=\"align-self:flex-start\">${esc(catName(i.category))}<\/span>\n          <h3>${esc(nm(i))}<\/h3>\n          <p>${esc(ds(i))}<\/p>\n          <div class=\"hl-foot\">${priceHtml(i)}<span class=\"more\">${esc(t(\"view\"))}${icon(\"arrowR\")}<\/span><\/div>\n        <\/div>\n      <\/button>`).join(\"\");\n    $(\"#railDots\").innerHTML = list.map((_, n) => `<button type=\"button\" aria-label=\"${n + 1} / ${list.length}\"><\/button>`).join(\"\");\n    updateDots();\n  }\n\n  // ---------- highlights carousel: auto-slide, pause on hover/focus/touch\n  const rail = () => $(\"#rail\");\n  const railStep = () => {\n    const c = rail().querySelector(\". abel>\n              <label class=\"field\"><span data-i18n=\"phone\"><\/span><input class=\"input\" name=\"phone\"><\/label>\n              <label class=\"field\"><span data-i18n=\"whatsapp\"><\/span><input class=\"input\" name=\"whatsapp\" inputmode=\"numeric\"><\/label>\n              <label class=\"field\"><span data-i18n=\"email\"><\/span><input class=\"input\" name=\"email\" type=\"email\"><\/label>\n              <label class=\"field span2\"><span data-i18n=\"tagline_en\"><\/span><input class=\"input\" name=\"tagline_en\"><\/label>\n              <label class=\"field span2\"><span data-i18n=\"tagline_ta\"><\/span><input class=\"input\" name=\"tagline_ta\" lang=\"ta\"><\/label>\n              <label class=\"field\"><span data-i18n=\"address_en\"><\/span><input class=\"input\" name=\"address_en\"><\/label>\n              <label class=\"field\"><span data-i18n=\"address_ta\"><\/span><input class=\"input\" name=\"address_ta\" lang=\"ta\"><\/label>\n              <label class=\"field\"><span data-i18n=\"hours_en\"><\/span><input class=\"input\" name=\"hours_en\"><\/label>\n              <label class=\"field\"><span data-i18n=\"hours_ta\"><\/span><input class=\"input\" name=\"hours_ta\" lang=\"ta\"><\/label>\n              <label class=\"field span2\"><span data-i18n=\"map\"><\/span><input class=\"input\" name=\"map_url\" type=\"url\"><\/label>\n              <label class=\"switch span2\"><input type=\"checkbox\" name=\"show_prices\"><span class=\"track\"><\/span><span data-i18n=\"show_prices\"><\/span><\/label>\n            <\/div>\n            <button class=\"btn btn-primary\" type=\"submit\" data-i18n=\"save_details\"><\/button>\n          <\/form>\n          <form class=\"step neu\" id=\"pwForm\">\n            <h2 data-i18n=\"admin_login\"><\/h2>\n            <label class=\"field\"><span data-i18n=\"username\"><\/span><input class=\"input\" name=\"username\" autocomplete=\"username\"><\/label>\n            <label class=\"field\"><span data-i18n=\"current_pw\"><\/span><input class=\"input\" name=\"current\" type=\"password\" autocomplete=\"current-password\" required><\/label>\n            <label class=\"field\"><span data-i18n=\"new_pw\"><\/span><input class=\"input\" name=\"new\" type=\"password\" autocomplete=\"new-password\" minlength=\"8\" required><\/label>\n            <p class=\"form-error\" id=\"pwError\" role=\"alert\"><\/p>\n            <button class=\"btn btn-primary\" type=\"submit\" data-i18n=\"update_login\"><\/button>\n          <\/form>\n        <\/div>\n      <\/section>\n    <\/main>\n  <\/div>\n\n  <!-- RIGHT-CLICK MENU (items table) -->\n  <div class=\"ctx glass\" id=\"ctx\" role=\"menu\" hidden>\n    <div class=\"ctx-head\" id=\"ctxHead\"><\/div>\n    <button type=\"button\" role=\"menuitem\" data-ctx=\"image\"><span data-icon=\"upload\"><\/span><span id=\"ctxImgLabel\"><\/span><\/button>\n    <button type=\"button\" role=\"menuitem\" data-ctx=\"remove-image\"><span data-icon=\"image\"><\/span><span data-i18n=\"ctx_remove_image\"><\/span><\/button>\n    <button type=\"button\" role=\"menuitem\" data-ctx=\"edit\"><span data-icon=\"edit\"><\/span><span data-i18n=\"ctx_edit\"><\/span><\/button>\n    <hr>\n    <button type=\"button\" role=\"menuitem\" data-ctx=\"delete\" class=\"danger\"><span data-icon=\"trash\"><\/span><span data-i18n=\"ctx_delete\"><\/span><\/button>\n  <\/div>\n  <input type=\"file\" id=\"rowImgFile\" accept=\".png,.jpg,.jpeg,.webp,.gif\" hidden>\n\n  <!-- ITEM EDITOR -->\n  <div class=\"modal-backdrop\" id=\"editModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"editTitle\">\n    <form class=\"modal glass\" id=\"editForm\">\n      <button class=\"btn btn-icon modal-close\" type=\"button\" data-close data-i18n-aria=\"close\"><span data-icon=\"close\"><\/span><\/button>\n      <h2 id=\"editTitle\"><\/h2>\n      <div class=\"edit-grid\">\n        <div class=\"edit-image\">\n          <div id=\"editArt\"><\/div>\n          <label class=\"btn btn-sm\" style=\"width:100%\"><input type=\"file\" id=\"editImgFile\" accept=\".png,.jpg,.jpeg,.webp,.gif\" hidden><span data-icon=\"upload\"><\/span><span data-i18n=\"upload_photo\"><\/span><\/label>\n          <label class=\"field\"><span data-i18n=\"or_url\"><\/span><input class=\"input\" name=\"image\" placeholder=\"https://… or /uploads/…\"><\/label>\n          <button class=\"btn btn-sm btn-danger\" type=\"button\" id=\"clearImg\" data-i18n=\"remove_photo\"><\/button>\n        <\/div>\n        <div class=\"form-grid\">\n          <label class=\"field\"><span data-i18n=\"f_sku\"><\/span><input class=\"input\" name=\"sku\" required><\/label>\n          <label class=\"field\"><span data-i18n=\"f_category\"><\/span><input class=\"input\" name=\"category\" list=\"catList\" required><\/label>\n          <label class=\"field span2\"><span data-i18n=\"f_name_en\"><\/span><input class=\"input\" name=\"name_en\" required><\/label>\n          <label class=\"field span2\"><span data-i18n=\"f_name_ta\"><\/span><input class=\"input\" name=\"name_ta\" lang=\"ta\"><\/label>\n          <label class=\"field\"><span data-i18n=\"f_brand\"><\/span><input class=\"input\" name=\"brand\"><\/label>\n          <label class=\"field\"><span data-i18n=\"f_unit\"><\/span><input class=\"input\" name=\"unit\"><\/label>\n          <label class=\"field\"><span data-i18n=\"f_price\"><\/span><input class=\"input\" name=\"price\" type=\"number\" step=\"0.01\" min=\"0\"><\/label>\n          <label class=\"field\"><span data-i18n=\"f_stock\"><\/span><input class=\"input\" name=\"stock\" type=\"number\" step=\"1\" min=\"0\"><\/label>\n          <label class=\"field\"><span data-i18n=\"f_avail\"><\/span><select class=\"select\" name=\"availability\" id=\"editAv\"><\/select><\/label>\n          <div class=\"field toggles\">\n            <label class=\"switch\"><input type=\"checkbox\" name=\"highlight\"><span class=\"track\"><\/span><span data-i18n=\"f_highlight\"><\/span><\/label>\n            <label class=\"switch\"><input type=\"checkbox\" name=\"innovation\"><span class=\"track\"><\/span><span data-i18n=\"f_innov\"><\/span><\/label>\n          <\/div>\n          <label class=\"field span2\"><span data-i18n=\"f_desc_en\"><\/span><textarea class=\"textarea\" name=\"desc_en\"><\/textarea><\/label>\n          <label class=\"field span2\"><span data-i18n=\"f_desc_ta\"><\/span><textarea class=\"textarea\" name=\"desc_ta\" lang=\"ta\"><\/textarea><\/label>\n          <label class=\"field span2\"><span data-i18n=\"f_specs\"><\/span><textarea class=\"textarea\" name=\"specs\"><\/textarea><\/label>\n        <\/div>\n      <\/div>\n      <p class=\"form-error\" id=\"editError\" role=\"alert\"><\/p>\n      <div class=\"row-btns end\">\n        <button class=\"btn\" type=\"button\" data-close data-i18n=\"cancel\"><\/button>\n        <button class=\"btn btn-primary\" type=\"submit\" data-i18n=\"save_item\"><\/button>\n      <\/div>\n      <datalist id=\"catList\"><\/datalist>\n    <\/form>\n  <\/div>\n\n  <div class=\"toast glass\" id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n\n  <script>window.KVS_SEED = /*SEED*/;<\/script>\n<script>\n// Standalone demo backend (used only by build_standalone.py).\n// Answers the pages' /api/* calls inside the browser; changes live in this browser's localStorage.\n(() => {\n  if (window.__kvsShim) return;\n  window.__kvsShim = true;\n\n  const SEED = window.KVS_SEED;                 // { items, settings, images: {key: dataURI} }\n  const KEY = \"kvs_demo_db_v1\";\n  const AV = [\"in_stock\", \"low_stock\", \"out_of_stock\", \"on_order\"];\n  const AV_LABEL = { in_stock: \"In Stock\", low_stock: \"Low Stock\", out_of_stock: \"Out of Stock\", on_order: \"On Order\" };\n  const LOW = 10;\n  const DEMO_USER = \"admin\", DEMO_PASS = \"kvs@2026\";\n  const XLSX_URL = \"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\";\n\n  // seed photos are referenced as \"seedimg:<key>\" so they are not copied into localStorage\n  const imgByKey = SEED.images || {};\n  const keyByImg = Object.fromEntries(Object.entries(imgByKey).map(([k, v]) => [v, k]));\n  const resolveImg = (s) => (s && s.startsWith(\"seedimg:\") ? imgByKey[s.slice(8)] || \"\" : s);\n  const packImg = (s) => (s && keyByImg[s] ? \"seedimg:\" + keyByImg[s] : s);\n\n  // ---------------------------------------------------------------- storage\n  let canStore = true, mem = null, memAdmin = false;\n  try { localStorage.setItem(\"__kvs\", \"1\"); localStorage.removeItem(\"__kvs\"); } catch { canStore = false; }\n  const fresh = () => ({ version: Date.now(), items: JSON.parse(JSON.stringify(SEED.items)), settings: { ...SEED.settings }, auth: { username: DEMO_USER, password: DEMO_PASS } });\n  function load() {\n    if (canStore) {\n      try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.items)) return d; } catch { /* corrupt -> reseed */ }\n    }\n    return mem || (mem = fresh());\n  }\n  function save(d) {\n    d.version = Date.now();\n    if (canStore) {\n      try { localStorage.setItem(KEY, JSON.stringify(d)); }\n      catch { throw new Error(\"Browser storage is full — remove some photos or use smaller images.\"); }\n    }\n    mem = d;\n    return d;\n  }\n  const isAdmin = () => { try { return sessionStorage.getItem(\"kvs_demo_admin\") === \"1\"; } catch { return memAdmin; } };\n  const setAdmin = (v) => { memAdmin = v; try { v ? sessionStorage.setItem(\"kvs_demo_admin\", \"1\") : sessionStorage.removeItem(\"kvs_demo_admin\"); } catch { /* ignore */ } };\n\n  // ---------------------------------------------------------------- normalising (mirrors app.py)\n  const rid = () => Math.random().toString(16).slice(2, 14).padEnd(12, \"0\");\n  const yes = (v) => typeof v === \"boolean\" ? v : [\"yes\", \"y\", \"true\", \"1\", \"✓\", \"x\", \"ஆம்\"].includes(String(v ?? \"\").trim().toLowerCase());\n  const num = (v, int) => {\n    if (v == null || String(v).trim() === \"\") return null;\n    const n = parseFloat(String(v).replace(/[,₹\\s]/g, \"\"));\n    return isNaN(n) ? null : int ? Math.trunc(n) : n;\n  };\n  function parseAv(v, stock) {\n    const s = String(v ?? \"\").trim().toLowerCase().replace(/[-_]/g, \" \");\n    if (s) {\n      if ([\"in stock\", \"available\", \"yes\", \"instock\", \"in\"].includes(s)) return \"in_stock\";\n      if (s.startsWith(\"low\") || [\"limited\", \"few left\"].includes(s)) return \"low_stock\";\n      if (s.startsWith(\"out\") || [\"no\", \"unavailable\", \"sold out\", \"nil\"].includes(s)) return \"out_of_stock\";\n      if (s.includes(\"order\") || [\"pre order\", \"coming soon\", \"awaited\"].includes(s)) return \"on_order\";\n    }\n    if (stock == null) return \"in_stock\";\n    if (stock <= 0) return \"out_of_stock\";\n    return stock <= LOW ? \"low_stock\" : \"in_stock\";\n  }\n  const str = (v) => String(v ?? \"\").trim();\n  function normalise(it) {\n    const stock = num(it.stock, true);\n    const out = {\n      id: it.id || rid(), sku: str(it.sku), name_en: str(it.name_en), name_ta: str(it.name_ta),\n      category: str(it.category) || \"Other\", brand: str(it.brand), desc_en: str(it.desc_en), desc_ta: str(it.desc_ta),\n      unit: str(it.unit), price: num(it.price), stock, image: packImg(str(it.image)),\n      highlight: yes(it.highlight), innovation: yes(it.innovation), specs: str(it.specs), updated: Math.floor(Date.now() / 1000),\n    };\n    out.availability = AV.includes(it.availability) ? it.availability : parseAv(it.availability, stock);\n    if (!out.sku) out.sku = \"KVS-\" + out.id.slice(0, 6).toUpperCase();\n    return out;\n  }\n\n  // ---------------------------------------------------------------- Excel (SheetJS, loaded on first use)\n  const COLUMNS = [\n    [\"sku\", \"SKU\", 16, [\"code\", \"item code\", \"part no\", \"id\"]],\n    [\"name_en\", \"Name (English)\", 34, [\"name\", \"item\", \"item name\", \"product\", \"product name\"]],\n    [\"name_ta\", \"Name (Tamil)\", 34, [\"tamil name\", \"பெயர்\"]],\n    [\"category\", \"Category\", 20, [\"group\", \"type\"]],\n    [\"brand\", \"Brand\", 18, [\"make\", \"manufacturer\"]],\n    [\"unit\", \"Unit\", 16, [\"uom\", \"pack\", \"per\"]],\n    [\"price\", \"Price (INR)\", 13, [\"price\", \"rate\", \"mrp\", \"price inr\"]],\n    [\"stock\", \"Stock Qty\", 11, [\"stock\", \"qty\", \"quantity\", \"stock quantity\"]],\n    [\"availability\", \"Availability\", 16, [\"status\", \"available\"]],\n    [\"highlight\", \"Highlight (Yes/No)\", 16, [\"highlight\", \"featured\"]],\n    [\"innovation\", \"New Innovation (Yes/No)\", 20, [\"innovation\", \"new innovation\", \"new\"]],\n    [\"image\", \"Image (URL or file name)\", 30, [\"image\", \"image url\", \"photo\", \"picture\"]],\n    [\"desc_en\", \"Description (English)\", 50, [\"description\", \"details\"]],\n    [\"desc_ta\", \"Description (Tamil)\", 50, [\"tamil description\", \"விவரம்\"]],\n    [\"specs\", \"Specs (Key: Value; ...)\", 50, [\"specs\", \"specifications\"]],\n  ];\n  const headerKey = (h) => {\n    h = String(h ?? \"\").trim().toLowerCase().replace(/\\s+/g, \" \");\n    const c = COLUMNS.find(([k, head, , al]) => h === head.toLowerCase() || h === k || al.includes(h));\n    return c ? c[0] : null;\n  };\n  let xlsxP = null;\n  function loadXLSX() {\n    if (window.XLSX) return Promise.resolve(window.XLSX);\n    return (xlsxP ??= new Promise((ok, bad) => {\n      const s = document.createElement(\"script\");\n      s.src = XLSX_URL;\n      s.onload = () => ok(window.XLSX);\n      s.onerror = () => { xlsxP = null; bad(new Error(\"Excel features need an internet connection (the Excel library could not be loaded).\")); };\n      document.head.appendChild(s);\n    }));\n  }\n  async function downloadWorkbook(items, filename) {\n    const X = await loadXLSX();\n    const rows = [COLUMNS.map((c) => c[1])];\n    items.forEach((it) => rows.push(COLUMNS.map(([k]) => {\n      const v = it[k];\n      if (k === \"availability\") return AV_LABEL[v] || v;\n      if (k === \"highlight\" || k === \"innovation\") return v ? \"Yes\" : \"No\";\n      if (k === \"image\") return /^https?:\\/\\//i.test(v || \"\") ? v : \"\"; // embedded photos stay in the app; blank keeps them on import\n      return v ?? \"\";\n    })));\n    const ws = X.utils.aoa_to_sheet(rows);\n    ws[\"!cols\"] = COLUMNS.map((c) => ({ wch: c[2] }));\n    const help = X.utils.aoa_to_sheet([\n      [\"KVS&CO item workbook\"], [],\n      [\"SKU\", \"Unique code per item. Import matches existing items by SKU (merge mode).\"],\n      [\"Name (English/Tamil)\", \"Tamil is optional — English is shown if Tamil is blank.\"],\n      [\"Price (INR)\", \"Optional indicative price. Leave blank for 'Price on request'.\"],\n      [\"Stock Qty\", \"Optional. If Availability is blank it is derived: 0 = Out of Stock, 1-10 = Low Stock, more = In Stock.\"],\n      [\"Availability\", \"In Stock / Low Stock / Out of Stock / On Order.\"],\n      [\"Highlight / New Innovation\", \"Yes puts the item in the Highlights rail / New Innovations section.\"],\n      [\"Image\", \"Optional web URL. Easier: leave blank and add photos in Admin > Items (right-click an item). Blank keeps the existing photo.\"],\n      [\"Specs\", \"Key: Value pairs separated by semicolons, e.g. Grade: 53; Standard: IS 12269\"],\n      [], [\"Import modes\", \"Merge = add new SKUs and update existing ones. Replace = the workbook becomes the full catalogue.\"],\n    ]);\n    help[\"!cols\"] = [{ wch: 28 }, { wch: 100 }];\n    const wb = X.utils.book_new();\n    X.utils.book_append_sheet(wb, ws, \"Items\");\n    X.utils.book_append_sheet(wb, help, \"How to use\");\n    X.writeFile(wb, filename);\n  }\n  async function parseWorkbook(file) {\n    const X = await loadXLSX();\n    let wb;\n    try { wb = X.read(await file.arrayBuffer(), { type: \"array\" }); } catch (e) { throw new Error(\"Could not read workbook: \" + e.message); }\n    const ws = wb.Sheets.Items || wb.Sheets[wb.SheetNames[0]];\n    const grid = X.utils.sheet_to_json(ws, { he (result);\n    }\n    const unresolvedImages = result.filter((i) => i.image && !/^(https?:\\/\\/|data:|seedimg:)/i.test(i.image)).map((i) => i.sku);\n    const summary = { mode, rows: rows.length, added, updated, removed, errors, unresolvedImages, total: final.length, committed: false };\n    if (!dry) { d.items = final; summary.version = save(d).version; summary.committed = true; }\n    return summary;\n  }\n\n  // ---------------------------------------------------------------- photos -> resized data URLs\n  async function toDataURL(file) {\n    const ext = (file.name.match(/\\.[^.]+$/) || [\"\"])[0].toLowerCase();\n    if (![\".png\", \".jpg\", \".jpeg\", \".webp\", \".gif\"].includes(ext)) throw new Error(`${file.name}: only PNG, JPG, WEBP or GIF images are allowed.`);\n    const url = URL.createObjectURL(file);\n    try {\n      const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error(`${file.name}: file content is not a valid image.`)); i.src = url; });\n      const s = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));\n      const c = document.createElement(\"canvas\");\n      c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));\n      c.getContext(\"2d\").drawImage(img, 0, 0, c.width, c.height);\n      return ext === \".png\" ? c.toDataURL(\"image/webp\", 0.85) : c.toDataURL(\"image/jpeg\", 0.82);\n    } finally { URL.revokeObjectURL(url); }\n  }\n\n  // ---------------------------------------------------------------- router\n  const res = (status, obj) => new Response(JSON.stringify(obj), { status, headers: { \"Content-Type\": \"application/json\" } });\n  const view = (d) => ({ version: d.version, items: d.items.map((i) => ({ ...i, image: resolveImg(i.image) })) });\n  const SETTING_KEYS = [\"company_name\", \"tagline_en\", \"tagline_ta\", \"phone\", \"whatsapp\", \"email\", \"address_en\", \"address_ta\", \"hour டங்குங்கள், அல்லது தற்போதைய பட்டியலை ஏற்றுமதி செய்து, எக்செலில் திருத்தி மீண்டும் இறக்குமதி செய்யுங்கள்.\",\n    template: \"டெம்ப்ளேட்\", export: \"தற்போதைய பொருட்களை ஏற்றுமதி செய்\",\n    step2_title: \"பதிவேற்றி முன்னோட்டம் பாருங்கள்\", drop_xl: \".xlsx கோப்பை இங்கே இழுத்து விடுங்கள் அல்லது கிளிக் செய்து தேர்வு செய்யுங்கள்\", drop_xl_hint: '\"Items\" தாள் (அல்லது முதல் தாள்). தலைப்புகள் டெம்ப்ளேட்டில் உள்ளபடி.',\n    mode_merge: \"இணை\", mode_merge_d: \"புதிய குறியீடுகளைச் சேர்க்கும், பொருந்தியவற்றைப் புதுப்பிக்கும். காலி கலங்கள் தற்போதைய மதிப்பை (படங்கள் உட்பட) வைத்திருக்கும். எதுவும் நீக்கப்படாது.\",\n    mode_replace: \"முழுவதும் மாற்று\", mode_replace_d: \"கோப்பே முழு பட்டியலாக மாறும். அதில் இல்லாத பொருட்கள் நீக்கப்படும். பொருந்தும் குறியீடுகளின் படங்கள் வைக்கப்படும்.\",\n    step3_title: \"சரிபார்த்து பயன்படுத்துங்கள்\", preview_empty: \"என்ன மாறும் என்பதைப் பார்க்க ஒரு கோப்பைத் தேர்வு செய்யுங்கள்.\", apply: \"இணையதளத்தில் பயன்படுத்து\", reading: \"கோப்பைப் படிக்கிறது…\",\n    rows_read: \"படித்த வரிசைகள்\", new_items: \"புதிய பொருட்கள்\", updated: \"புதுப்பிக்கப்பட்டவை\", removed: \"நீக்கப்படுபவை\",\n    new_l: \"புதியவை:\", updated_l: \"புதுப்பிக்கப்பட்டவை:\", removed_l: \"நீக்கப்படும் (முழு மாற்று முறை):\",\n    unresolved: \"பட இணைப்பு கிடைக்கவில்லை — பொருட்கள் தாவலில் பொருளின் மீது வலது கிளிக் செய்து படத்தைச் சேர்க்கவும்:\",\n    row_n: \"வரிசை {n}: \", after_total: \"பயன்படுத்திய பின் பட்டியலில் {n} பொருட்கள் இருக்கும்.\",\n    confirm_replace: \"இந்தக் கோப்பால் முழு பட்டியலையும் மாற்றவா? கோப்பில் இல்லாத பொருட்கள் நீக்கப்படும்.\",\n    imported: \"இறக்குமதி: {a} புதியவை, {u} புதுப்பிப்பு, {r} நீக்கம்\", applied: \"✓ பயன்படுத்தப்பட்டது. இணையதளத்தில் இப்போது {n} பொருட்கள்.\", xlsx_only: \".xlsx கோப்பைத் தேர்வு செய்யுங்கள்\",\n    business: \"வணிக விவரங்கள்\", company: \"நிறுவனப் பெயர்\", phone: \"தொலைபேசி\", whatsapp: \"வாட்ஸ்அப் எண் (நாட்டுக் குறியீட்டுடன், எண்கள் மட்டும்)\", email: \"மின்னஞ்சல்\",\n    tagline_en: \"வாசகம் (ஆங்கிலம்)\", tagline_ta: \"வாசகம் (தமிழ்)\", address_en: \"முகவரி (ஆங்கிலம்)\", address_ta: \"முகவரி (தமிழ்)\",\n    hours_en: \"நேரம் (ஆங்கிலம்)\", hours_ta: \"நேரம் (தமிழ்)\", map: \"கூகுள் மேப்ஸ் இணைப்பு (விருப்பம்)\", show_prices: \"இணையதளத்தில் குறிப்பு விலைகளைக் காட்டு\",\n    save_details: \"விவரங்களைச் சேமி\", details_saved: \"விவரங்கள் சேமிக்கப்பட்டன\",\n    admin_login: \"நிர்வாகி உள்நுழைவு\", current_pw: \"தற்போதைய கடவுச்சொல்\", new_pw: \"புதிய கடவுச்சொல் (குறைந்தது 8 எழுத்துகள்)\", update_login: \"உள்நுழைவைப் புதுப்பி\", login_updated: \"உள்நுழைவு புதுப்பிக்கப்பட்டது\",\n    edit_item: \"பொருளைத் திருத்து\", upload_photo: \"படம் பதிவேற்று\", or_url: \"…அல்லது பட இணைப்பு (URL)\", remove_photo: \"படத்தை நீக்கு\",\n    f_sku: \"குறியீடு (SKU) *\", f_category: \"வகை *\", f_name_en: \"பெயர் (ஆங்கிலம்) *\", f_name_ta: \"பெயர் (தமிழ்)\", f_brand: \"பிராண்ட்\", f_unit: \"அலகு (எ.கா. 50 கிலோ மூட்டை)\",\n    f_price: \"விலை (₹, விருப்பம்)\", f_stock: \"இருப்பு அளவு (விருப்பம்)\", f_avail: \"இருப்பு நிலை\", f_highlight: \"சிறப்பம்சம்\", f_innov: \"புதிய கண்டுபிடிப்பு\",\n    f_desc_en: \"விவரம் (ஆங்கிலம்)\", f_desc_ta: \"விவரம் (தமிழ்)\", f_specs: \"விவரக்குறிப்புகள் — பெயர்: மதிப்பு; பெயர்: மதிப்பு\",\n    cancel: \"ரத்து\", save_item: \"பொருளைச் சேமி\", item_saved: \"பொருள் சேமிக்கப்பட்டது\", photo_pending: \"படம் பதிவேற்றப்பட்டது — வைத்திருக்க பொருளைச் சேமிக்கவும்\",\n    close: \"மூடு\", language: \"மொழி\", theme: \"தீம் மாற்று\",\n  },\n};\n\n<\/script>\n  <script>\n// KVS&CO admin\n(() => {\n  const $ = (s, el = document) => el.querySelector(s);\n  const $$ = (s, el = document) => [...el.querySelectorAll(s)];\n  const esc = (v) => String(v ?? \"\").replace(/[&<>\"']/g, (c) => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c]));\n  const store = {\n    get(k) { try { return localStorage.getItem(k); } catch { return null; } },\n    set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } },\n  };\n  const AV_KEYS = [\"in_stock\", \"low_stock\", \"out_of_stock\", \"on_order\"];\n  const state = { lang: store.get(\"kvs_lang\") === \"ta\" ? \"ta\" : \"en\", items: [], settings: {}, q: \"\", cat: \"\", av: \"\", editing: null, xlFile: null, ctxItem: null };\n\n  // admin strings first, then shared site strings (availability, categories)\n  const t = (k, vars = {}) => {\n    let s = ADMIN_I18N[state.lang][k] ?? I18N[state.lang][k] ?? ADMIN_I18N.en[k] ?? I18N.en[k] ?? k;\n    for (const [a, b] of Object.entries(vars)) s = s.split(`{${a}}`).join(b);\n    return s;\n  };\n  const catName = (c) => (state.lang === \"ta\" && I18N.ta.cat[c]) || c;\n  const itemName = (i) => (state.lang === \"ta\" && i.name_ta) || i.name_en;\n\n  function paintStatic() {\n    document.documentElement.lang = state.lang;\n    $$(\"[data-i18n]\").forEach((el) => (el.textContent = t(el.dataset.i18n)));\n    $$(\"[data-i18n-ph]\").forEach((el) => (el.placeholder = t(el.dataset.i18nPh)));\n    $$(\"[data-i18n-aria]\").forEach((el) => el.setAttribute(\"aria-label\", t(el.dataset.i18nAria)));\n    $$(\"[data-i18n-title]\").forEach((el) => (el.title = t(el.dataset.i18nTitle)));\n    $$(\".lang-switch button\").forEach((b) => b.setAttribute(\"aria-pressed\", String(b.dataset.lang === state.lang)));\n    const avOpts = AV_KEYS.map((k) => `<option value=\"${k}\">${esc(t(k))}<\/option>`).join(\"\");\n    $(\"#aAv\").innerHTML = `<option value=\"\">${esc(t(\"all_availability\"))}<\/option>` + avOpts;\n    $(\"#aAv\").value = state.av;\n    const ev = $(\"#editAv\"), cur = ev.value;\n    ev.innerHTML = avOpts; if (cur) ev.value = cur;\n    if (state.xlFile) $(\"#xlName\").textContent = state.xlFile.name;\n  }\n  document.addEventListener(\"click\", (e) => {\n    const b = e.target.closest(\".lang-switch button[data-lang]\");\n    if (!b || b.dataset.lang === state.lang) return;\n    state.lang = b.dataset.lang; store.set(\"kvs_lang\", state.lang);\n    paintStatic(); renderItems();\n    if ($(\"#editModal\").classList.contains(\"
